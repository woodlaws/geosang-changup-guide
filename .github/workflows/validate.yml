name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Verify required deployment files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f vercel.json
          test -f robots.txt
          test -f sitemap.xml
          test -f resources/index.html
          test -f roadmap/validation/index.html
          test -f downloads/estimate.xlsx
